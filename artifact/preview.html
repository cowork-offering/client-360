<!--
  Commercial Credit 360 — live-data artifact template (Accenture client engagement).

  This is the PRODUCTION template. It renders ENTIRELY from an injected window.C360_DATA object.
  The agent bakes real JSON into the <script id="c360-data"> slot below (replacing the literal
  {{C360_DATA_JSON}} placeholder) at create_artifact / update_artifact time. There is no fetch()
  in this file — all data arrives pre-fetched from the Customer360 Salesforce-hosted MCP (7 tools,
  per-user OAuth) + Boom MCP, shaped verbatim per MAPPING.md §1.

  Design: the Accenture reference mockup (Commercial Credit 360.dc.html), rewired from a hardcoded
  data{} block to this adapter. Full visual design / CSS / tab system / tone-tint color semantics
  are preserved. The original relied on an external DCLogic runtime (support.js) + a design-system
  bundle that don't travel with a standalone artifact, so the {{ }} / <sc-if> / <sc-for> engine is
  reimplemented here inline as a small self-contained renderer — functionally equivalent, zero
  external dependencies, opens standalone in any browser.

  Gap discipline (MAPPING.md §5): a number renders only if it traces to a tool-response field.
  Everything the source org does not carry renders an honest gap chip with its provenance. No
  composite health-index score, no invented deposit wallets, no unsupported KYC-clearance claim,
  no reference-mockup borrowers.
-->

<script>
"use strict";
/* ============================================================================
   Commercial Credit 360 — standalone render engine + view-model adapter.
   ============================================================================ */

/* ---- read the injected data (null-safe) ---- */
function readData(){
  var el = document.getElementById('c360-data');
  var raw = el ? el.textContent : '';
  // preview/unrendered guard: an unreplaced placeholder or empty slot
  if(!raw || raw.indexOf('{{C360_DATA_JSON}}') !== -1 || !raw.trim()) return null;
  try { return JSON.parse(raw); } catch(e){ console.error('C360_DATA parse error', e); return null; }
}

/* ---- tiny html helpers ---- */
function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function attr(s){ return esc(s); }

/* ---- formatting (all client-side, per MAPPING.md §1) ---- */
function fmtMoney(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  var abs = Math.abs(n);
  if(abs >= 1e9) return '$' + (n/1e9).toFixed(2).replace(/\.00$/,'') + 'B';
  if(abs >= 1e6) return '$' + (n/1e6).toFixed(2).replace(/\.00$/,'') + 'M';
  if(abs >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
  return '$' + Math.round(n).toLocaleString('en-US');
}
function fmtRatio(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return Number(n).toFixed(2) + '×'; }
function fmtPct(n,dp){ if(n===null||n===undefined||isNaN(n)) return '—'; return Number(n).toFixed(dp===undefined?1:dp) + '%'; }
function fmtRate(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return Number(n).toFixed(2) + '%'; }
function fmtDate(iso){
  if(!iso) return '—';
  var d = new Date(iso + (iso.length===10 ? 'T00:00:00' : ''));
  if(isNaN(d.getTime())) return esc(iso);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

/* ---- color semantics (tone/tint) — accent from meta ---- */
var ACCENT = '#6B1CC4';
function tint(hex,a){ try{ var n=parseInt(String(hex).slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }catch(e){ return 'rgba(107,28,196,'+a+')'; } }
var S = {}, T = {};
function initPalette(accent){
  ACCENT = accent || '#6B1CC4';
  S = { green:'#047857', amber:'#92400E', red:'#991B1B', purple:ACCENT, neutral:'#56535F', muted:'#8A8794' };
  T = { green:'#E8F4EF', amber:'#FBF2E7', red:'#FBECEC', purple:tint(ACCENT,0.1), neutral:'#F1F0F6' };
}

/* ---- coverage-ratio arc geometry ---- */
function arc(pct,r){ var c=2*Math.PI*r; var p=Math.max(0,Math.min(100,pct||0)); return { c:+c.toFixed(2), off:+(c*(1-p/100)).toFixed(2) }; }

/* ============================================================================
   COVENANT CUSHION — direction-aware.
   Heuristic (documented per MAPPING.md §2 Tab 7): a covenant is a FLOOR (≥, actual
   must stay ABOVE threshold) unless it looks like a CAP (≤, actual must stay BELOW
   threshold). We infer direction from covenantType keywords, falling back to the
   numeric relationship of the compliant reading:
     - CAP keywords: leverage, debt-to-worth, debt to worth, debt/worth, capex,
       fixed asset, loan-to-value, ltv, concentration, limit, maximum, max
     - FLOOR keywords: coverage, dsc, dscr, liquidity, worth, tangible net worth,
       current ratio, minimum, min
   If keywords are inconclusive AND the covenant is currently compliant, we use the
   compliant sign: actual >= threshold => floor; actual < threshold => cap.
   Cushion is always expressed as "distance INTO the safe zone" (positive = safe):
     floor: actual - threshold ;  cap: threshold - actual.
   ========================================================================= */
function covenantDirection(type, actual, threshold){
  var t = (type||'').toLowerCase();
  var capHints = ['leverage','debt-to-worth','debt to worth','debt/worth','capex','fixed asset','fixed-asset','loan-to-value','loan to value','ltv','concentration','limit','maximum',' max'];
  var floorHints = ['coverage','dsc','dscr','liquidity','tangible net worth','net worth','current ratio','minimum',' min','working capital'];
  for(var i=0;i<capHints.length;i++){ if(t.indexOf(capHints[i])!==-1) return 'cap'; }
  for(var j=0;j<floorHints.length;j++){ if(t.indexOf(floorHints[j])!==-1) return 'floor'; }
  if(actual!==null && threshold!==null){ return actual >= threshold ? 'floor' : 'cap'; }
  return 'floor';
}
function covenantCushion(type, actual, threshold){
  if(actual===null || actual===undefined || threshold===null || threshold===undefined) return { cushion:null, dir:covenantDirection(type,actual,threshold), pct:0, safe:null };
  var dir = covenantDirection(type, actual, threshold);
  var cushion = dir==='cap' ? (threshold - actual) : (actual - threshold);
  var safe = cushion >= 0;
  // cushion bar %: how much room as a share of the threshold band (0..100, clamped)
  var denom = Math.abs(threshold) > 1e-9 ? Math.abs(threshold) : 1;
  var pct = Math.max(0, Math.min(100, Math.round((cushion/denom)*100)));
  return { cushion:cushion, dir:dir, pct:pct, safe:safe };
}
/* format a covenant value: money if large, ratio if small — inferred from magnitude */
function fmtCovVal(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  if(Math.abs(n) >= 1000) return fmtMoney(n);
  return Number(n).toFixed(2) + '×';
}
function fmtCovThreshold(type, actual, threshold){
  if(threshold===null||threshold===undefined) return '—';
  var dir = covenantDirection(type, actual, threshold);
  var sym = dir==='cap' ? '≤ ' : '≥ ';
  return sym + fmtCovVal(threshold);
}

/* ---- status tone from covenant status/breach ---- */
function covTone(cov){
  if(cov.breached === true) return 'red';
  var st = (cov.lastEvaluationStatus || cov.covenantStatus || '').toLowerCase();
  if(st.indexOf('breach')!==-1 || st.indexOf('default')!==-1 || st.indexOf('non-compliant')!==-1 || st.indexOf('noncompliant')!==-1) return 'red';
  if(st.indexOf('watch')!==-1 || st.indexOf('warning')!==-1 || st.indexOf('pending')!==-1) return 'amber';
  return 'green';
}

/* ============================================================================
   ADAPTER — window.C360_DATA  ->  view-model.
   Each block maps tool-response field names (the Apex wrapper fields) to the
   existing bindings. Missing/empty -> gap or empty state. No invented figures.
   ========================================================================= */
function buildBorrowerVM(data){
  var b = data.borrower || {};
  var snap = b.snapshot || {};
  var exp = b.exposure || {};
  var cov = b.covenants || {};
  var graph = b.graph || {};
  var opps = b.opportunities || {};
  var signals = b.signals || {};
  var boom = b.boom || null;

  var vm = { raw:b, snap:snap, exp:exp, cov:cov, graph:graph, opps:opps, signals:signals, boom:boom };

  vm.name = snap.name || '—';
  vm.sector = [snap.industry, snap.naicsCode ? ('NAICS ' + snap.naicsCode) : null].filter(Boolean).join(' · ') || '—';
  vm.verdict = b.verdict || '';

  /* anchors — agent-composed from live figures only */
  vm.anchors = (b.anchors || []).map(function(a){
    return {
      label:a.label, value:a.value, sub:a.sub,
      arrow: a.dir==='down'?'↓':a.dir==='up'?'↑':'',
      arrowColor: a.dir==='down'?S.red : a.dir==='up'?S.green : 'transparent'
    };
  });

  /* risk-grade badge (replaces the reference health-index ring) */
  vm.grade = snap.primaryRiskRating != null ? String(snap.primaryRiskRating) : null;
  vm.stage = snap.primaryStage || null;

  return vm;
}

/* find the DSC covenant row */
function findDSC(covs){
  if(!covs) return null;
  for(var i=0;i<covs.length;i++){
    var t=(covs[i].covenantType||'').toLowerCase();
    if(t.indexOf('debt service')!==-1 || t.indexOf('dscr')!==-1 || t.indexOf('dsc')!==-1 || (t.indexOf('coverage')!==-1 && t.indexOf('interest')===-1)) return covs[i];
  }
  return null;
}
/* find a leverage covenant */
function findLeverage(covs){
  if(!covs) return null;
  for(var i=0;i<covs.length;i++){
    var t=(covs[i].covenantType||'').toLowerCase();
    if(t.indexOf('leverage')!==-1 || t.indexOf('debt-to-worth')!==-1 || t.indexOf('debt to worth')!==-1) return covs[i];
  }
  return null;
}

/* ============================================================================
   TAB RENDERERS
   ========================================================================= */
function renderOverview(data, vm){
  var snap = vm.snap, exp = vm.exp, boom = vm.boom;
  var covs = (vm.cov.covenants) || [];
  var cards = [];

  // 1. Risk Rating
  cards.push(kpiCard('Risk Rating',
    vm.grade!=null ? 'Grade '+esc(vm.grade) : gapInline('Not rated in source'),
    vm.stage ? esc(vm.stage) : 'Stage not set',
    vm.grade!=null ? {text:'nCino grade', tone:'neutral'} : null, null));

  // 2. Total Committed
  var committed = exp.totalCommitted, drawn = exp.totalOutstanding, avail = exp.totalAvailable;
  cards.push(kpiCard('Total Committed', fmtMoney(committed),
    fmtMoney(drawn)+' drawn · '+fmtMoney(avail)+' available',
    {text:'Live from facilities', tone:'green'}, null));

  // 3. Debt Service Coverage
  var dsc = findDSC(covs);
  if(dsc){
    var c = covenantCushion(dsc.covenantType, dsc.actualValue, dsc.thresholdValue);
    var tone = covTone(dsc);
    cards.push(kpiCard('Debt Service Coverage', fmtRatio(dsc.actualValue),
      fmtCovThreshold(dsc.covenantType,dsc.actualValue,dsc.thresholdValue)+' · Cushion '+ (c.cushion!=null?fmtRatio(Math.abs(c.cushion)):'—'),
      {text: dsc.breached ? 'Breached' : (tone==='green'?'Compliant':'Watch'), tone:tone},
      tone==='red'?'red':null));
  } else {
    cards.push(kpiCardGap('Debt Service Coverage','No DSC covenant on file','Customer360Covenants'));
  }

  // 4. Revenue (LTM)
  var rev = snap.annualRevenue;
  var ebitdaSub = 'Manufacturing';
  if(boom && boom.ratios){
    var eb = boom.ratios.ebitda, mg = boom.ratios.ebitdaMargin;
    ebitdaSub = (eb!=null?('EBITDA '+fmtMoney(eb)):'') + (mg!=null?(' · Margin '+fmtPct(mg)):'');
    if(!ebitdaSub.trim()) ebitdaSub = snap.industry||'';
  } else {
    ebitdaSub = snap.industry ? esc(snap.industry) : 'EBITDA — Boom not fetched';
  }
  cards.push(kpiCard('Revenue (LTM)', fmtMoney(rev), ebitdaSub, {text:'Account revenue', tone:'neutral'}, null));

  // 5. Total Leverage
  if(boom && boom.ratios && boom.ratios.totalLeverage!=null){
    var lev = boom.ratios.totalLeverage;
    var levCov = findLeverage(covs);
    var levSub = 'Debt / EBITDA' + (levCov && levCov.thresholdValue!=null ? (' · Covenant '+fmtRatio(levCov.thresholdValue)) : '');
    cards.push(kpiCard('Total Leverage', fmtRatio(lev), levSub, {text:'Boom spreading', tone:'green'}, null));
  } else {
    cards.push(kpiCardGap('Total Leverage','Boom spread not fetched this session','boom_get_ratios'));
  }

  // 6. Operating Wallet — real zero with provenance
  cards.push(kpiCard('Operating Wallet', '$0', 'No deposit relationship on file',
    {text:'Cross-sell', tone:'purple'}, 'red'));

  var html = '<div>';
  html += sectionHead('Overview · live from source', 'overview', null);
  html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px">' + cards.join('') + '</div>';

  // Watch banner — only if agent composed one
  if(vm.raw.watch){
    html += '<div style="background:#FBF2E7;border-radius:14px;padding:18px 22px;margin-bottom:16px;display:flex;gap:14px;align-items:flex-start">'
      + '<svg width="20" height="20" viewBox="0 0 20 20" style="flex:none;margin-top:1px;color:#92400E"><path d="M10 2L1 17.5h18z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path><path d="M10 8v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path><circle cx="10" cy="14.6" r=".9" fill="currentColor"></circle></svg>'
      + '<div><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#92400E;margin-bottom:4px">Watch</div>'
      + '<div style="font-size:14px;font-weight:500;line-height:1.5;color:#5A4423;text-wrap:pretty">'+esc(vm.raw.watch)+'</div></div></div>';
  }

  // NBA card — from opportunities[0] + deposits-zero story
  var nbaLead, nbaTail, nbaBig = '$0';
  var opp0 = (vm.opps.opportunities||[])[0];
  if(opp0){
    nbaLead = esc(opp0.name) + '.';
    nbaTail = (opp0.stage?('Stage: '+esc(opp0.stage)+'. '):'') + 'Plus the standing deposit cross-sell — this borrower holds zero operating balances against its credit.';
    nbaBig = opp0.amount!=null ? fmtMoney(opp0.amount) : '$0';
  } else {
    nbaLead = 'Win the operating deposits.';
    nbaTail = 'This borrower holds zero operating balances against its committed credit — the treasury conversation is the natural next best action.';
  }
  html += '<div style="background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 7%, #fff), color-mix(in srgb, var(--accent) 13%, #fff));border-radius:14px;padding:20px 24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap">'
    + '<div style="flex:1;min-width:260px">'
    + '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:5px">Next best action</div>'
    + '<div style="font-size:15px;font-weight:600;line-height:1.45;color:#2E2640">'+nbaLead+' <span style="color:#56535F;font-weight:500">'+nbaTail+'</span></div></div>'
    + '<div style="font-size:44px;font-weight:800;letter-spacing:-.03em;color:var(--accent);line-height:1">'+esc(nbaBig)+'</div></div>';

  html += noteCaption(vm.snap.note);
  html += '</div>';
  return html;
}

function kpiCard(label, value, sub, badge, valTone){
  var badgeHtml = badge ? '<span style="flex:none;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:7px;background:'+T[badge.tone]+';color:'+S[badge.tone]+'">'+esc(badge.text)+'</span>' : '';
  var valColor = valTone ? S[valTone] : '#1A1A1A';
  return '<div class="card" style="padding:18px 20px">'
    + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px"><span style="font-size:12.5px;font-weight:600;color:#8A8794">'+esc(label)+'</span>'+badgeHtml+'</div>'
    + '<div style="font-size:30px;font-weight:800;letter-spacing:-.02em;margin:8px 0 5px;color:'+valColor+'">'+value+'</div>'
    + '<div style="font-size:12.5px;font-weight:400;color:#6E6B7B">'+sub+'</div></div>';
}
function kpiCardGap(label, gapTitle, tool){
  return '<div class="card" style="padding:18px 20px">'
    + '<div style="font-size:12.5px;font-weight:600;color:#8A8794;margin-bottom:12px">'+esc(label)+'</div>'
    + gapChip(gapTitle, 'Source: '+tool)+'</div>';
}
function gapInline(txt){ return '<span style="font-size:16px;font-weight:600;color:#8A8794">'+esc(txt)+'</span>'; }

/* ---- Exposure & Collateral ---- */
function renderExposure(data, vm){
  var exp = vm.exp;
  var facs = exp.facilities || [];
  if(!facs.length){
    return '<div class="card" style="padding:24px">'+sectionHead('Exposure & Collateral','exposure',null)+emptyState('No active facilities','No active facilities found for this account in the source org.')+noteCaption(exp.note)+'</div>';
  }
  var committed = exp.totalCommitted, drawn = exp.totalOutstanding, avail = exp.totalAvailable;
  var drawnPct = committed>0 ? Math.round((drawn/committed)*100) : 0;

  // aggregate lendable + a portfolio coverage (weighted by outstanding)
  var totalLendable = 0, hasLendable=false;
  facs.forEach(function(f){ if(f.totalLendableValue!=null){ totalLendable += f.totalLendableValue; hasLendable=true; } });
  var aggCoverage = (hasLendable && drawn>0) ? (totalLendable/drawn) : null;
  var covTone2 = aggCoverage==null ? 'neutral' : (aggCoverage < 1 ? 'red' : 'green');
  var covLabel = aggCoverage==null ? '—' : fmtRatio(aggCoverage);
  var covStatus = aggCoverage==null ? 'Not computable' : (aggCoverage<1 ? 'Under-covered' : 'Covered');

  var html = '<div style="display:flex;flex-direction:column;gap:16px">';
  html += sectionHead('Exposure & Collateral · live match','exposure',null);

  // stat strip
  html += '<div class="card" style="padding:18px 26px;display:flex;gap:40px;flex-wrap:wrap">'
    + statCell('Committed', fmtMoney(committed))
    + '<div style="width:1px;background:#ECEAF2"></div>'
    + statCell('Drawn', fmtMoney(drawn))
    + '<div style="width:1px;background:#ECEAF2"></div>'
    + statCellColored('Collateral coverage', covLabel, S[covTone2])
    + '</div>';

  // committed vs drawn bar
  html += '<div class="card" style="padding:22px 26px">'
    + '<div class="kicker">Committed vs Drawn</div>'
    + '<div style="margin:16px 0 12px;height:46px;border-radius:11px;background:#EFEEF4;display:flex;overflow:hidden">'
    + '<div style="width:'+drawnPct+'%;background:#36323F;display:flex;align-items:center;padding-left:16px;color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden">Drawn '+fmtMoney(drawn)+'</div>'
    + '<div style="flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:16px;color:#56535F;font-size:12.5px;font-weight:600;white-space:nowrap">Available '+fmtMoney(avail)+'</div></div>'
    + '<div style="display:flex;justify-content:space-between;font-size:12px;color:#8A8794"><span>Total committed</span><span style="font-weight:700;color:#1A1A1A">'+fmtMoney(committed)+'</span></div></div>';

  // collateral breakdown + coverage dial
  var allPledges = [];
  facs.forEach(function(f){ (f.collateral||[]).forEach(function(p){ allPledges.push(p); }); });
  var collBreak;
  if(allPledges.length){
    collBreak = allPledges.map(function(p){
      return '<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F1F0F5;font-size:13.5px"><span style="color:#3F3D4A">'+esc(p.collateralType||'Collateral')+(p.lienPosition?(' · '+esc(p.lienPosition)):'')+(p.advanceRate!=null?(' · '+fmtPct(p.advanceRate,0)+' adv'):'')+'</span><span style="font-weight:700">'+fmtMoney(p.currentLendableValue!=null?p.currentLendableValue:p.collateralValue)+'</span></div>';
    }).join('');
  } else {
    collBreak = gapChip('No collateral pledged','Customer360Exposure — 0 Loan_Collateral2 rows');
  }
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'
    + '<div class="card" style="padding:22px 26px">'
    + '<div class="kicker" style="margin-bottom:14px">Collateral breakdown</div>'+collBreak
    + (hasLendable ? '<div style="display:flex;justify-content:space-between;padding:12px 0 0;font-size:14px;font-weight:800"><span>Total lendable</span><span>'+fmtMoney(totalLendable)+'</span></div>' : '')
    + '</div>'
    + '<div class="card" style="padding:22px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">'
    + '<div class="kicker" style="margin-bottom:8px">Coverage ratio</div>'
    + '<div style="font-size:52px;font-weight:800;letter-spacing:-.03em;color:'+S[covTone2]+';line-height:1">'+covLabel+'</div>'
    + '<div style="font-size:12.5px;color:#6E6B7B;margin:8px 0 13px">'+(hasLendable?('Lendable '+fmtMoney(totalLendable)+' / Drawn '+fmtMoney(drawn)):'Lendable value not on file')+'</div>'
    + '<span style="font-size:12px;font-weight:700;padding:6px 14px;border-radius:8px;background:'+T[covTone2]+';color:'+S[covTone2]+'">'+esc(covStatus)+'</span></div></div>';

  // facilities table
  var rows = facs.map(function(f){
    var st = f.riskGrade || 'Active';
    var tone = 'green';
    return '<div style="display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1.1fr 1fr 0.9fr;gap:12px;padding:13px 24px;font-size:13px;border-top:1px solid #F1F0F5;align-items:center">'
      + '<span style="font-weight:700">'+esc(f.name||'Facility')+'</span>'
      + '<span style="color:#3F3D4A">'+esc(f.productType||'—')+'</span>'
      + '<span style="font-weight:600">'+fmtMoney(f.committed)+'</span>'
      + '<span style="font-weight:600">'+fmtMoney(f.outstanding)+'</span>'
      + '<span style="color:#56535F">'+(f.interestRate!=null?fmtRate(f.interestRate):'—')+'</span>'
      + '<span style="color:#56535F">'+fmtDate(f.maturityDate)+'</span>'
      + '<span style="justify-self:start;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;background:'+T[tone]+';color:'+S[tone]+'">'+esc(f.coverageShortfall?'Shortfall':(f.riskGrade||'Active'))+'</span></div>';
  }).join('');
  html += '<div class="card" style="padding:8px 0 6px">'
    + '<div style="padding:16px 24px 6px" class="kicker">Facilities</div>'
    + '<div style="display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1.1fr 1fr 0.9fr;gap:12px;padding:8px 24px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#A5A2AE"><span>Facility</span><span>Type</span><span>Commitment</span><span>Drawn</span><span>Rate</span><span>Maturity</span><span>Status</span></div>'
    + rows + '</div>';

  html += noteCaption(exp.note);
  html += '</div>';
  return html;
}

/* ---- Financials (Boom) ---- */
function renderFinancials(data, vm){
  var boom = vm.boom;
  if(!boom || (!boom.spread && !boom.ratios)){
    return '<div class="card" style="padding:24px">'+sectionHead('Financials','financials',null)+emptyState('Boom spread not fetched this session','The financial spread is served by the Boom MCP (boom_get_spread / boom_get_ratios). It was not fetched for this render — ask to generate the spread to populate this tab.')+'</div>';
  }
  var spread = boom.spread || {};
  var ratios = boom.ratios || {};
  var periods = spread.periods || [];
  var covs = (vm.cov.covenants)||[];
  var levCov = findLeverage(covs);

  var html = '<div style="display:flex;flex-direction:column;gap:16px">';
  html += sectionHead('Financials · Boom spreading','financials',null);

  // revenue & ebitda chart
  if(periods.length){
    var maxRev = Math.max.apply(null, periods.map(function(p){ return p.revenue||0; }));
    var bars = periods.map(function(p){
      var rH = maxRev>0 ? Math.round((p.revenue||0)/maxRev*160) : 0;
      var eH = maxRev>0 ? Math.round((p.ebitda||0)/maxRev*160) : 0;
      return '<div style="flex:1;display:flex;align-items:flex-end;gap:7px;height:100%;justify-content:center">'
        + '<div style="width:26px;height:'+rH+'px;background:#C7C2D4;border-radius:4px 4px 0 0"></div>'
        + '<div style="width:26px;height:'+eH+'px;background:#4A4754;border-radius:4px 4px 0 0"></div></div>';
    }).join('');
    var labels = periods.map(function(p){
      return '<div style="flex:1;text-align:center"><div style="font-size:12px;font-weight:700">'+esc(p.period||'')+'</div><div style="font-size:11px;color:#6E6B7B;font-weight:600;margin-top:1px">'+(p.margin!=null?fmtPct(p.margin):'')+'</div></div>';
    }).join('');
    html += '<div class="card" style="padding:22px 26px">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><div class="kicker">Revenue & EBITDA</div>'
      + '<div style="display:flex;gap:18px;font-size:11.5px;color:#56535F"><span style="display:flex;align-items:center;gap:6px"><span style="width:11px;height:11px;border-radius:3px;background:#C7C2D4"></span>Revenue</span><span style="display:flex;align-items:center;gap:6px"><span style="width:11px;height:11px;border-radius:3px;background:#4A4754"></span>EBITDA</span></div></div>'
      + '<div style="display:flex;align-items:flex-end;gap:20px;height:172px;padding:0 8px">'+bars+'</div>'
      + '<div style="display:flex;gap:20px;padding:11px 8px 0;border-top:1px solid #F1F0F5;margin-top:8px">'+labels+'</div></div>';
  }

  // gauges
  var lev = ratios.totalLeverage, ic = ratios.interestCoverage;
  var levThresh = levCov && levCov.thresholdValue!=null ? levCov.thresholdValue : null;
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">';
  html += gaugeCard('Total Leverage', lev, 'Debt / EBITDA', levThresh!=null?('Covenant '+fmtRatio(levThresh)):'No leverage covenant', 6, levThresh, true);
  html += gaugeCard('Interest Coverage', ic, 'EBITDA / Interest', null, 6, null, false);
  html += '</div>';

  // income statement
  var items = spread.lineItems || [];
  if(items.length){
    var rows = items.map(function(r){
      var chg = (r.ltm!=null && r.priorFy!=null && r.priorFy!==0) ? ((r.ltm-r.priorFy)/Math.abs(r.priorFy)*100) : null;
      var chgColor = chg==null?'#56535F':(chg<0?S.amber:S.green);
      var chgTxt = chg==null?'—':((chg>=0?'+':'−')+Math.abs(chg).toFixed(1)+'%');
      return '<div style="display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:12px;padding:12px 24px;font-size:13px;border-top:1px solid #F1F0F5;align-items:center">'
        + '<span style="font-weight:600">'+esc(r.line||'')+'</span>'
        + '<span style="font-weight:700">'+fmtMoney(r.ltm)+'</span>'
        + '<span style="color:#56535F">'+fmtMoney(r.priorFy)+'</span>'
        + '<span style="font-weight:700;color:'+chgColor+'">'+chgTxt+'</span></div>';
    }).join('');
    html += '<div class="card" style="padding:8px 0 6px">'
      + '<div style="padding:16px 24px 6px" class="kicker">Income statement · LTM vs prior year</div>'
      + '<div style="display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:12px;padding:8px 24px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#A5A2AE"><span>Line</span><span>LTM</span><span>Prior FY</span><span>Change</span></div>'
      + rows + '</div>';
  }

  html += noteCaption(boom.note || (spread.sourceFile ? ('Source: Boom spreading — '+spread.sourceFile) : 'Source: Boom spreading'));
  html += '</div>';
  return html;
}
function gaugeCard(label, val, sub, threshLabel, scaleMax, threshVal, higherIsWorse){
  var fillPct = val!=null ? Math.min(100, Math.round(val/scaleMax*100)) : 0;
  var threshPct = threshVal!=null ? Math.round(threshVal/scaleMax*100) : null;
  var color = S.green;
  if(val!=null && threshVal!=null){
    if(higherIsWorse){ color = val>threshVal?S.red:(threshVal-val<0.4?S.amber:S.green); }
    else { color = val<threshVal?S.red:(val-threshVal<0.4?S.amber:S.green); }
  } else if(val==null){ color = '#C2BFCC'; }
  return '<div class="card" style="padding:22px 26px">'
    + '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px"><span style="font-size:13px;font-weight:600;color:#3F3D4A">'+esc(label)+'</span><span style="font-size:20px;font-weight:800;color:'+color+'">'+fmtRatio(val)+'</span></div>'
    + '<div style="position:relative;height:10px;background:#ECEAF2;border-radius:6px"><div style="height:100%;width:'+fillPct+'%;background:'+color+';border-radius:6px"></div>'
    + (threshPct!=null?'<div style="position:absolute;top:-4px;bottom:-4px;left:'+threshPct+'%;width:2px;background:#1A1A1A"></div>':'')+'</div>'
    + '<div style="display:flex;justify-content:space-between;font-size:11px;color:#8A8794;margin-top:8px"><span>'+esc(sub)+'</span><span>'+esc(threshLabel||'')+'</span></div></div>';
}

  return html;
}

  html += '</div>';

  html += noteCaption(signals.note);
  html += '</div>';
  return html;
}

/* ============================================================================
   TOP-LEVEL RENDER — two levels per MAPPING.md §3:
   L1 Portfolio Home (served by ONE Customer360Portfolio call: accounts[] +
   bookTotals + signals + note; ribbon prefers server bookTotals, concentration
   computed client-side; no health-index rail — no source) and L2 Customer 360.
   ========================================================================= */
var STATE = { screen:null, activeTab:'overview', explainOpen:null };
/* Render-scope globals: set once per data injection by render(); the scoped
   re-renderers (renderScreen / renderTab / rerenderPanelOnly) read these so
   interactions never re-parse data or rebuild the whole app. */
var DATA = null, VM = null, TAB_CACHE = {};

/* Initial screen: honor persisted meta.screen first (so full-replace re-renders
   keep the user's place), else L2 when meta.activeTab is set or the data is
   single-account, else L1. Missing/empty portfolio.accounts -> straight to L2
   (no empty L1 shell). */
function initScreen(data){
  if(STATE.screen !== null) return;
  var meta = data.meta || {};
  var accts = (data.portfolio && data.portfolio.accounts) || [];
  if(!accts.length){ STATE.screen = 'c360'; return; }
  if(meta.screen === 'portfolio'){ STATE.screen = 'portfolio'; return; }
  if(meta.screen === 'c360'){ STATE.screen = 'c360'; return; }
  if(meta.activeTab){ STATE.screen = 'c360'; return; }
  STATE.screen = accts.length > 1 ? 'portfolio' : 'c360';
}
function setScreen(scr){
  STATE.screen = scr;
  if(window.C360_DATA && window.C360_DATA.meta) window.C360_DATA.meta.screen = scr;
  renderScreen(); // scoped: only the screen container, never the nav chrome
}
function hasPortfolio(data){
  return !!(data && data.portfolio && data.portfolio.accounts && data.portfolio.accounts.length);
}

/* ---- L1 Portfolio Home (slim live) ----
   Source: ONE Customer360Portfolio call (MAPPING §3, 2026-07-02) — verbatim
   response { accounts[], bookTotals, signals, note }. Adapter prefers the
   server-computed bookTotals for the ribbon and falls back to a client-side
   Σ over accounts[] for backward compat with the older plain {accounts} shape. */
function renderPortfolio(data){
  var pf = data.portfolio || {};
  var accts = (pf.accounts || []).slice();
  var meta = data.meta || {};
  accts.sort(function(a,b){ return (b.tce||0) - (a.tce||0); });

  // KPI ribbon — bookTotals preferred (server-computed, spans ALL packaged
  // accounts even when accounts[] is truncated); client-side Σ as fallback.
  var sumTce = 0, sumOut = 0;
  accts.forEach(function(a){ sumTce += (a.tce||0); sumOut += (a.outstanding||0); });
  var bt = pf.bookTotals || null;
  var committed = (bt && bt.totalCommitted != null) ? bt.totalCommitted : sumTce;
  var drawnTot = (bt && bt.totalOutstanding != null) ? bt.totalOutstanding : sumOut;
  var acctCount = (bt && bt.accountCount != null) ? bt.accountCount : accts.length;
  var util = (bt && bt.utilizationPct != null) ? bt.utilizationPct : (committed > 0 ? (drawnTot/committed*100) : null);

  var kpis = [
    { label:'Managed Exposure', value:fmtMoney(committed), sub:'Committed · '+acctCount+' relationship'+(acctCount===1?'':'s') },
    { label:'Drawn Balance', value:fmtMoney(drawnTot), sub:'Across the book' },
    { label:'Utilization', value:util!=null?fmtPct(util):'—', sub:'Drawn / committed' },
    { label:'Relationships', value:String(acctCount), sub:'Accounts in book' }
  ];
  // Reviews-due + EWS cells — live from portfolio.signals (Customer360Portfolio).
  // Guard: signals missing (older {accounts}-only shape) -> keep the 4-cell ribbon.
  var sig = pf.signals || null;
  if(sig){
    var due = sig.covenantsDueSoon || [];
    var overdueN = due.filter(function(c){ return c.overdue === true; }).length;
    kpis.push({ label:'Reviews Due', value:String(due.length),
      sub: overdueN>0 ? (overdueN+' overdue') : 'None overdue',
      valColor: overdueN>0 ? S.amber : null });
    var breachedN = sig.breachedCount || 0;
    var matN = (sig.maturitiesSoon || []).length;
    var ewsParts = [];
    if(breachedN>0) ewsParts.push(breachedN+' breached');
    if(matN>0) ewsParts.push(matN+(matN===1?' maturity':' maturities'));
    kpis.push({ label:'EWS Active', value:String(breachedN+matN),
      sub: ewsParts.length ? ewsParts.join(' · ') : 'None in window',
      valColor: breachedN>0 ? S.red : (matN>0 ? S.amber : null) });
  }
  var ribbon = '<div style="background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(26,10,54,.05),0 6px 20px rgba(26,10,54,.05);display:flex;margin-bottom:18px;overflow:hidden">'
    + kpis.map(function(k,i){

      }).join('')
    + '</div>';

  // Account list (replaces the reference work queue) — sorted tce desc.
  // Anchor row -> client-side switch to L2 (data already loaded); other rows ->
  // sendPrompt (guarded) so the agent fetches + update_artifact.
  var rows = accts.map(function(a,i){
    var g = parseInt(a.riskRating,10);
    var tone = isNaN(g) ? 'neutral' : (g<=4?'green':g<=6?'amber':'red');
    var isAnchor = a.accountId === meta.anchorAccountId;
    var sampleChip = a._sample_only ? '<span style="flex:none;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;background:#F1F0F6;color:#8A8794;letter-spacing:.04em;text-transform:uppercase">sample</span>' : '';
    return '<div class="wq-row pf-row" role="button" tabindex="0" data-account-id="'+attr(a.accountId)+'" data-account-name="'+attr(a.name)+'" data-anchor="'+(isAnchor?'1':'0')+'" style="display:flex;align-items:center;gap:18px;padding:16px 22px;border-top:1px solid #F1F0F5;cursor:pointer;transition:background .15s" onmouseover="this.style.background=\'#FAF9FC\'" onmouseout="this.style.background=\'transparent\'">'
      + '<span style="font-size:13px;font-weight:700;color:#C2BFCC;width:20px;flex:none;font-variant-numeric:tabular-nums">'+String(i+1).padStart(2,'0')+'</span>'
      + '<div style="flex:1;min-width:0">'
      + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:15px;font-weight:700;letter-spacing:-.01em">'+esc(a.name||'—')+'</span>'+sampleChip+'</div>'
      + '<div style="font-size:12.5px;font-weight:400;color:#6E6B7B;margin-top:2px">'+esc(a.industry||'—')+(a.naicsCode?(' · NAICS '+esc(a.naicsCode)):'')+'</div></div>'
      + '<div style="flex:none;text-align:right;min-width:92px"><div style="font-size:11px;font-weight:600;color:#8A8794">TCE</div><div style="font-size:14.5px;font-weight:800">'+fmtMoney(a.tce)+'</div></div>'
      + '<div style="flex:none;text-align:right;min-width:92px"><div style="font-size:11px;font-weight:600;color:#8A8794">Drawn</div><div style="font-size:14.5px;font-weight:700;color:#3F3D4A">'+fmtMoney(a.outstanding)+'</div></div>'
      + '<span style="flex:none;width:84px;text-align:center;font-size:11px;font-weight:700;padding:5px 0;border-radius:7px;background:'+T[tone]+';color:'+S[tone]+'">'+(a.riskRating!=null?('Grade '+esc(a.riskRating)):'—')+'</span>'
      + '<svg class="wq-chev" width="18" height="18" viewBox="0 0 18 18" style="flex:none;color:#C2BFCC;transition:transform .18s"><path d="M6.5 4l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>'
      + '</div>';
  }).join('');
  var listCard = '<div style="background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(26,10,54,.05),0 6px 22px rgba(26,10,54,.05);overflow:hidden">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px">'
    + '<div><div class="kicker">Book</div><div style="font-size:17px;font-weight:700;margin-top:3px">Relationships by exposure</div></div>'
    + '<span style="font-size:12px;font-weight:500;color:#8A8794">'+accts.length+' account'+(accts.length===1?'':'s')+' · sorted by TCE</span></div>'
    + '<div>'+rows+'</div></div>';

  // Book concentration — computed client-side: industry × Σtce
  var byInd = {};
  accts.forEach(function(a){ var k=a.industry||'Other'; byInd[k]=(byInd[k]||0)+(a.tce||0); });
  var conc = Object.keys(byInd).map(function(k){ return { s:k, v:byInd[k] }; }).sort(function(a,b){ return b.v-a.v; });
  var maxShare = conc.length && sumTce>0 ? (conc[0].v/sumTce*100) : 0;
  var concBars = conc.map(function(c){
    var p = sumTce>0 ? (c.v/sumTce*100) : 0;
    var w = maxShare>0 ? Math.round(p/maxShare*100) : 0;
    return '<div style="margin-bottom:13px">'
      + '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px"><span style="font-weight:500;color:#3F3D4A">'+esc(c.s)+'</span><span style="font-weight:700">'+p.toFixed(0)+'%</span></div>'
      + '<div style="height:6px;background:#F1F0F5;border-radius:6px;overflow:hidden"><div style="width:'+w+'%;height:100%;background:#36323F;border-radius:6px"></div></div></div>';
  }).join('');

    + '<div class="kicker" style="margin-bottom:14px">Book Concentration</div>'+concBars+'</div>';

  var dueCard = '';

        + '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(c.accountName||'—')+'</div>'
        + '<div style="font-size:11.5px;color:#6E6B7B;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(c.covenantType||'Covenant')+' · '+fmtDate(c.nextEvaluationDate)+'</div></div>'
        + chip + '</div>';
    }).join('');
    dueCard = '<div style="background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(26,10,54,.05),0 6px 22px rgba(26,10,54,.05);padding:17px 20px 12px">'

  }

  return '<div data-screen="portfolio" style="max-width:1340px;margin:0 auto;padding:26px 26px 60px">'
    + ribbon
    + '<div style="display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start">'
    + listCard
    + '<div style="display:flex;flex-direction:column;gap:20px">'+concCard+dueCard+'</div>'
    + '</div>'
    + (pf.note
        ? '<div class="note-cap" style="border-top:none;margin-top:14px">'+esc(pf.note)+'</div>'
        : '<div class="note-cap" style="border-top:none;margin-top:14px">Live from Customer360Portfolio. Package-level TCE/TBE/TOE rollups — never a naive loan sum.</div>')
    + '</div>';
}

/* Full render — ONLY for initial boot and data re-injection. Every interaction
   uses a scoped re-render instead: renderTab (tab switch, only #tab-host),
   renderScreen (L1<->L2, only #screen-host), rerenderPanelOnly (explain panel).
   The nav chrome — with its backdrop-filter — is rendered once here and never
   rebuilt, so the expensive blur layer sits over stable DOM. */
function render(){
  DATA = window.C360_DATA || readData();
  window.C360_DATA = DATA;
  var app = document.getElementById('app');

  if(!DATA){
    app.innerHTML = '<div style="max-width:640px;margin:80px auto;padding:32px;text-align:center;color:#6E6B7B;font-family:Inter,system-ui,sans-serif">'
      + '<div style="font-size:18px;font-weight:800;color:#1A1A1A;margin-bottom:8px">Preview mode — no data injected</div>'
      + '<div style="font-size:13.5px;line-height:1.6">This is the Commercial Credit 360 template. Inject a <code>window.C360_DATA</code> object into the <code>#c360-data</code> slot (or open <code>preview.html</code>) to render a live borrower.</div></div>';
    return;
  }

  var meta = DATA.meta || {};
  initPalette(meta.accent || '#6B1CC4');
  // restore active tab + panel + screen from injected state
  if(meta.activeTab) STATE.activeTab = meta.activeTab;
  var aiPanel = DATA.aiPanel || null;
  if(aiPanel && aiPanel.componentId) STATE.explainOpen = aiPanel.componentId;
  initScreen(DATA);
  if(!hasPortfolio(DATA)) STATE.screen = 'c360'; // guard: never an empty L1 shell

  VM = buildBorrowerVM(DATA);
  TAB_CACHE = {}; // fresh data -> drop cached tab HTML

  var userName = meta.user || 'Credit Officer';
  var initials = userName.split(/\s+/).map(function(w){return w[0];}).slice(0,2).join('').toUpperCase();
  var dateStr = meta.dateISO ? fmtDate(meta.dateISO) : '';

  // Static chrome: nav rendered once; screens render into #screen-host.
  app.innerHTML = '<div style="--accent:'+ACCENT+';min-height:100vh;background:radial-gradient(135% 85% at 50% -12%, #FBFAFE 0%, #F4F3F8 44%)">'
    + '<nav style="position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;height:60px;padding:0 26px;background:rgba(244,243,248,.72);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);box-shadow:0 1px 0 rgba(20,0,40,.07)">'
    + accentureLogo()
    + '<span style="width:1px;height:22px;background:rgba(20,0,40,.12)"></span>'
    + '<span style="font-size:15px;font-weight:700;letter-spacing:-.01em">Commercial Credit 360</span>'
    + '<div style="margin-left:auto;display:flex;align-items:center;gap:13px">'
    + '<div style="text-align:right;line-height:1.25"><div style="font-size:12.5px;font-weight:600">'+esc(userName)+'</div>'+(dateStr?'<div style="font-size:11px;font-weight:400;color:#8A8794">'+esc(dateStr)+'</div>':'')+'</div>'
    + '<div style="width:34px;height:34px;border-radius:50%;background:#36323F;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.02em">'+esc(initials)+'</div></div></nav>'
    + '<div id="screen-host"></div>'
    + '</div>';

  renderScreen();
  rerenderPanelOnly();
  bindDelegatedEvents();
}

/* Scoped: swap only the screen container (L1 <-> L2). Nav untouched. */
function renderScreen(){
  var host = document.getElementById('screen-host');
  if(!host) return;
  if(STATE.screen === 'portfolio'){
    if(STATE.explainOpen){ STATE.explainOpen = null; rerenderPanelOnly(); } // no explain panel on L1
    host.innerHTML = renderPortfolio(DATA);
  } else {
    host.innerHTML = l2Chrome(DATA, VM) + '<div id="tab-host" style="max-width:1340px;margin:0 auto;padding:24px 26px 70px"></div>';
    renderTab();
  }
}

/* Scoped: swap only the tab content host. Tab HTML is cached per data
   injection (lazy — built on first visit), so revisits are instant and the
   verdict bar / tab rail / nav are never rebuilt on a tab switch. */
function renderTab(){
  var host = document.getElementById('tab-host');
  if(!host) return;
  var tab = STATE.activeTab;
  if(TAB_CACHE[tab] === undefined) TAB_CACHE[tab] = tabContent(tab);
  host.innerHTML = TAB_CACHE[tab];
  updateTabRail();
}
function tabContent(tab){
  if(tab==='overview') return renderOverview(DATA, VM);
  if(tab==='relationships') return renderRelationships(DATA, VM);
  if(tab==='exposure') return renderExposure(DATA, VM);
  if(tab==='deposits') return renderDeposits(DATA, VM);
  if(tab==='pnl') return renderPnl(DATA, VM);
  if(tab==='financials') return renderFinancials(DATA, VM);
  if(tab==='risk') return renderRisk(DATA, VM);
  if(tab==='kyc') return renderKyc(DATA, VM);
  if(tab==='opps') return renderOpps(DATA, VM);
  return '';
}
/* Update the existing rail buttons in place — no rail rebuild. */
function updateTabRail(){
  Array.prototype.forEach.call(document.querySelectorAll('.tab-btn'), function(btn){
    var active = btn.getAttribute('data-tab') === STATE.activeTab;
    btn.style.fontWeight = active ? '700' : '500';
    btn.style.color = active ? ACCENT : '#6E6B7B';
    btn.style.borderBottom = '2px solid ' + (active ? ACCENT : 'transparent');
  });
}

function borrowerLabel(){
  var d = window.C360_DATA || {}; var snap = (d.borrower&&d.borrower.snapshot)||{};
  var acct = (snap.accountId) || (d.meta&&d.meta.anchorAccountId) || '';
  return { name: snap.name || 'this borrower', accountId: acct };
}

/* Event delegation — ONE click + ONE keydown listener on document, bound once
   at boot. Scoped re-renders (tab switch, screen switch, panel updates) swap
   innerHTML freely without ever rebinding a listener. */
var EVENTS_BOUND = false;
function closestSel(el, sel){ while(el && el.nodeType===1){ if(el.matches(sel)) return el; el = el.parentElement; } return null; }
function activate(target){
  var el;
  // tab switch -> scoped tab re-render only (verdict bar / rail / nav untouched)
  if((el = closestSel(target, '.tab-btn'))){
    STATE.activeTab = el.getAttribute('data-tab');
    if(window.C360_DATA && window.C360_DATA.meta) window.C360_DATA.meta.activeTab = STATE.activeTab;
    renderTab();
    return;
  }
  // L1 rows: anchor -> client-side L2; others -> sendPrompt (guarded)
  if((el = closestSel(target, '.pf-row'))){
    if(el.getAttribute('data-anchor') === '1'){ setScreen('c360'); return; }
    var p = 'Open Customer 360 for '+el.getAttribute('data-account-name')+' ('+el.getAttribute('data-account-id')+')';
    if(hasSendPrompt()){ window.sendPrompt(p); } else { toast('Open Customer 360 — '+p); }
    return;
  }
  if(closestSel(target, '#crumb-portfolio')){ setScreen('portfolio'); return; }
  if((el = closestSel(target, '[data-explain]'))){ STATE.explainOpen = el.getAttribute('data-explain'); rerenderPanelOnly(); return; }
  if(closestSel(target, '#btn-memo')){ var b = borrowerLabel(); var pm = 'Draft the credit memo for '+b.name+' ('+b.accountId+')'; if(hasSendPrompt()){ window.sendPrompt(pm); } else { toast('Draft Credit Memo — '+pm); } return; }
  if(closestSel(target, '#btn-spread')){ var b2 = borrowerLabel(); var ps = 'Generate the financial spread for '+b2.name; if(hasSendPrompt()){ window.sendPrompt(ps); } else { toast('Generate Spreading — '+ps); } return; }
  if((el = closestSel(target, '.suggest-q'))){ submitExplain(STATE.explainOpen, el.getAttribute('data-question')); return; }
  if(closestSel(target, '#explain-send')){ var inp = document.getElementById('explain-input'); submitExplain(STATE.explainOpen, inp ? inp.value : ''); return; }
  if(closestSel(target, '#explain-close') || closestSel(target, '#explain-scrim')){ closePanel(); return; }
}
function bindDelegatedEvents(){
  if(EVENTS_BOUND) return;
  EVENTS_BOUND = true;
  document.addEventListener('click', function(e){ if(e.target && e.target.nodeType === 1) activate(e.target); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && STATE.explainOpen){ closePanel(); return; }
    var t = e.target;
    if(!t || t.nodeType !== 1) return;
    if(e.key === 'Enter' && !e.shiftKey && t.id === 'explain-input'){ e.preventDefault(); submitExplain(STATE.explainOpen, t.value); return; }
    if((e.key === 'Enter' || e.key === ' ') && t.matches && (t.matches('.pf-row') || t.matches('#crumb-portfolio'))){ e.preventDefault(); activate(t); }
  });
}

function rerenderPanelOnly(){
  var host = document.getElementById('explain-host') || (function(){ var d=document.createElement('div'); d.id='explain-host'; document.body.appendChild(d); return d; })();
  var aiPanel = (window.C360_DATA && window.C360_DATA.aiPanel) || null;
  host.innerHTML = STATE.explainOpen ? renderExplainPanel(STATE.explainOpen, aiPanel) : '';
}

function closePanel(){ STATE.explainOpen = null; if(window.C360_DATA) window.C360_DATA.aiPanel = null; rerenderPanelOnly(); }

function submitExplain(componentId, question){
  if(!question || !question.trim()) return;
  question = question.trim();
  // optimistic append client-side (thinking placeholder)
  var d = window.C360_DATA || {};
  if(!d.aiPanel || d.aiPanel.componentId !== componentId){ d.aiPanel = { componentId: componentId, thread: [] }; }
  d.aiPanel.thread.push({ q: question, a: '' });
  window.C360_DATA = d;
  var payload = JSON.stringify({ type:'explain', component: componentId, question: question });
  if(hasSendPrompt()){ window.sendPrompt(payload); }
  else { toast('Explain (preview) — '+payload); }
  rerenderPanelOnly();
}

/* ---- boot ---- */
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', render);
else render();
</script>
</body>
</html>
